<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AI Scanner with Y-Depth</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        canvas.overlay {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="container"></div>
    <canvas id="overlay" class="overlay"></canvas>

    <script type="module">
        import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.166.0/build/three.module.js";

        const container = document.getElementById('container');
        const overlay = document.getElementById('overlay');
        const overlayCtx = overlay.getContext('2d');

        const ROWS = 32, COLS = 32;
        const TOTAL_REVEAL_MS = 4000;
        const TILE_FADE_MS = 400;
        const AI_SHOW_PROB = 0.3;
        const LINE_FADE_MS = 400;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio || 1);
        container.appendChild(renderer.domElement);

        let scene, camera, tiles = [], orderedIndices = [], revealStartTime = 0;
        let overlayItems = [];

        function resizeAll() {
            const w = window.innerWidth, h = window.innerHeight;
            renderer.setSize(w, h);
            overlay.width = w * (devicePixelRatio || 1);
            overlay.height = h * (devicePixelRatio || 1);
            overlay.style.width = w + 'px';
            overlay.style.height = h + 'px';
            overlayCtx.setTransform(devicePixelRatio || 1, 0, 0, devicePixelRatio || 1, 0, 0);
            if (camera) {
                camera.left = -w / 2; camera.right = w / 2; camera.top = h / 2; camera.bottom = -h / 2;
                camera.updateProjectionMatrix();
            }
        }
        window.addEventListener('resize', resizeAll);

        function easeOutQuad(t) { return 1 - (1 - t) * (1 - t); }
        function lerp(a, b, t) { return a + (b - a) * t; }

        async function loadAndPrepare() {
            resizeAll();
0
            const img = await loadImage('images/forest.png');

            const imgW = img.naturalWidth, imgH = img.naturalHeight;
            const screenW = window.innerWidth, screenH = window.innerHeight;
            const scale = Math.min(screenW / imgW, screenH / imgH);
            const worldImgW = imgW * scale, worldImgH = imgH * scale;
            const tileSize = worldImgW / COLS;
            const originX = -worldImgW / 2 + tileSize / 2;
            const originY = worldImgH / 2 - tileSize / 2;

            // --- Draw image to canvas ---
            const imgCanvas = document.createElement('canvas');
            imgCanvas.width = imgW; imgCanvas.height = imgH;
            const imgCtx = imgCanvas.getContext('2d');
            imgCtx.drawImage(img, 0, 0, imgW, imgH);

            // --- Prepare tiles ---
            tiles = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const sx = c * imgW / COLS, sy = r * imgH / ROWS, sw = imgW / COLS, sh = imgH / ROWS;
                    const tc = document.createElement('canvas');
                    tc.width = sw; tc.height = sh;
                    tc.getContext('2d').drawImage(imgCanvas, sx, sy, sw, sh, 0, 0, sw, sh);
                    const tex = new THREE.CanvasTexture(tc);
                    tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter; tex.generateMipmaps = false; tex.needsUpdate = true;

                    const wx = originX + c * tileSize;
                    const wy = originY - r * tileSize;

                    // --- Y-coordinate heuristic for priority ---
                    const priority = 1 - ((wy + worldImgH / 2) / worldImgH); // bottom = closer, top = farther

                    tiles.push({
                        r, c,
                        world: { x: wx, y: wy, size: tileSize },
                        texture: tex,
                        revealed: false,
                        priority,
                        mesh: null
                    });
                }
            }

            // --- Order tiles by priority (bottom first) ---
            orderedIndices = tiles.map((t, i) => ({ i, priority: t.priority }));
            orderedIndices.sort((a, b) => a.priority - b.priority + (Math.random() - 0.05) * 0.05);
            orderedIndices = orderedIndices.map(o => o.i);

            // --- Three.js scene ---
            scene = new THREE.Scene();
            camera = new THREE.OrthographicCamera(-screenW / 2, screenW / 2, screenH / 2, -screenH / 2, -1000, 1000);
            camera.position.z = 10;

            for (const t of tiles) {
                const geo = new THREE.PlaneGeometry(t.world.size, t.world.size);
                const mat = new THREE.MeshBasicMaterial({ map: t.texture, transparent: true, opacity: 0 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(t.world.x, t.world.y, 0);
                scene.add(mesh);
                t.mesh = mesh;
            }

            const now = performance.now();
            revealStartTime = now;
            orderedIndices.forEach((idx, k) => {
                tiles[idx].revealAt = now + (k / orderedIndices.length) * TOTAL_REVEAL_MS;
            });

            requestAnimationFrame(loop);
        }

        function worldToScreen(wx, wy) { return { x: wx + window.innerWidth / 2, y: window.innerHeight / 2 - wy }; }
        async function loadImage(url) { return new Promise((res, rej) => { const img = new Image(); img.crossOrigin = "anonymous"; img.onload = () => res(img); img.onerror = e => rej(e); img.src = url; }); }

        function loop(now) {
            requestAnimationFrame(loop);
            const tnow = performance.now();

            overlayCtx.clearRect(0, 0, overlay.width, overlay.height);

            for (const t of tiles) {
                if (!t.revealed && t.revealAt && tnow >= t.revealAt) {
                    t.revealed = true;

                    // Randomly show AI box + number
                    if (Math.random() < AI_SHOW_PROB) {
                        const screen = worldToScreen(t.world.x, t.world.y);
                        overlayItems.push({
                            x: screen.x, y: screen.y, size: t.world.size,
                            alpha: 1, number: Math.floor(Math.random() * 100),
                            fadeStart: tnow + 10
                        });
                    }
                }
                if (t.revealed && t.mesh && t.mesh.material) {
                    const age = tnow - t.revealAt;
                    const alpha = Math.min(1, age / TILE_FADE_MS);
                    t.mesh.material.opacity = easeOutQuad(alpha);
                }
            }

            // Draw overlay items
            overlayItems = overlayItems.filter(item => {
                const fade = Math.max(0, 1 - (tnow - item.fadeStart) / LINE_FADE_MS);
                if (fade <= 0) return false;
                overlayCtx.strokeStyle = `rgba(255,255,255,${fade})`;
                overlayCtx.lineWidth = 2;
                overlayCtx.strokeRect(item.x - item.size / 2, item.y - item.size / 2, item.size, item.size);
                overlayCtx.fillStyle = `rgba(255,255,255,${fade})`;
                overlayCtx.font = `${item.size / 3}px Arial`;
                overlayCtx.textAlign = "right";
                overlayCtx.textBaseline = "bottom";
                overlayCtx.fillText(item.number, item.x + item.size / 2 - 2, item.y + item.size / 2 - 2);
                return true;
            });

            renderer.render(scene, camera);
        }

        loadAndPrepare().catch(console.error);

    </script>
</body>

</html>
